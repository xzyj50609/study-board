org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# android.overridePathCheck 已于 2026-08-07 删除。
# 它原本是为了让工程能待在中文目录「252原子任务学习进度」里；那条注释当时就写了
# 「如果以后出现莫名其妙的资源或打包错误，第一个要排除的就是它」——后来真应验了：
# Compose 截图测试插件在中文路径下会把路径按 Latin-1 解出乱码，图渲染不出来。
# 现在目录已改名为 study-board，路径纯 ASCII，这个覆盖开关不再需要。
# ⚠️ 别把工程搬回含中文/空格的路径，也别把这行加回来。

kotlin.code.style=official

# Compose 截图测试（还是实验特性，这里和 app/build.gradle.kts 的
# experimentalProperties 两处都要开，少一处任务不会生成）
android.experimental.enableScreenshotTest=true
